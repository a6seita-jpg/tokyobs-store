name: Deploy one-time admin bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ucfyorkuhndbtsrpfozb
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing GitHub Actions secret SUPABASE_DB_PASSWORD" && exit 1)
          npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@latest db push --linked

      - name: Configure bootstrap secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ADMIN_BOOTSTRAP_SECRET: ${{ secrets.ADMIN_BOOTSTRAP_SECRET }}
          SUPABASE_PROJECT_REF: ucfyorkuhndbtsrpfozb
        run: |
          test -n "$ADMIN_BOOTSTRAP_SECRET" || (echo "Missing GitHub Actions secret ADMIN_BOOTSTRAP_SECRET" && exit 1)
          if [ "${#ADMIN_BOOTSTRAP_SECRET}" -lt 32 ]; then
            echo "ADMIN_BOOTSTRAP_SECRET must be at least 32 characters"
            exit 1
          fi
          npx --yes supabase@latest secrets set "ADMIN_BOOTSTRAP_SECRET=$ADMIN_BOOTSTRAP_SECRET" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy one-time bootstrap function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ucfyorkuhndbtsrpfozb
        run: |
          npx --yes supabase@latest functions deploy admin-bootstrap --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
